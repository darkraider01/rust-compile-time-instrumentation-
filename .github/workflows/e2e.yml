name: End-to-End Registry & Benchmark

# Opt-in validation workflow running against live crates.io registry dependencies
# (e.g. census-0.4.2) with CARGO_INSTRUMENT_REGISTRY=1, verifying runtime telemetry
# export, cross-crate parenting, source cache immutability, and overhead benchmarks.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Nightly run at 04:00 UTC

env:
  CARGO_TERM_COLOR: always
  CARGO_INSTRUMENT_REGISTRY: "1"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-validation:
    name: Registry E2E & Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e-registry

      # Prefetch census-0.4.2 into local cargo registry cache so cache immutability test has target
      - name: Prefetch registry dependencies
        run: cargo check -p cargo-instrument --tests

      - name: Run E2E registry tests
        run: cargo test --workspace --test e2e_registry_tests -- --ignored --nocapture

      - name: Run registry source cache immutability guard
        run: cargo test --workspace --test trampoline_tests test_registry_source_cache_immutability -- --ignored --nocapture

      - name: P2.4 public opt-in and lifecycle acceptance
        run: cargo test -p cargo-instrument --test p24_closeout_tests -- --nocapture --test-threads=2

      - name: P2.4 isolated R-4 migration proof (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p cargo-instrument --test r4_extern_injection_tests -- --ignored --nocapture

      - name: Run overhead benchmarks (A17)
        run: cargo bench --bench bench_overhead

      - name: Document E2E results
        if: always()
        shell: bash
        run: |
          {
            echo "## E2E Registry & Benchmark Validation (\`${{ matrix.os }}\`)"
            echo
            echo "Job outcome: ${{ job.status }}. See individual steps for registry, P2.4, and benchmark evidence."
            echo
            echo "| Category | Acceptance Criteria | Result |"
            echo "|---|---|---|"
            echo "| Registry acceptance | A4–A8, A11–A18 | See registry test and benchmark steps |"
            echo "| P2.4 public workflow | CLI, lifecycle, metadata, immutability | See public opt-in acceptance step |"
            echo "| R-4 migration | Linux task parenting and fail-open | See isolated migration step on Linux |"
          } >> "$GITHUB_STEP_SUMMARY"
