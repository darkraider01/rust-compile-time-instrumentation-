[package]
name = "cargo-instrument"
version = "0.1.0"
edition = "2021"
authors = ["OpenTelemetry Rust Compile-Time Instrumentation Contributors"]
description = "Compile-time OpenTelemetry instrumentation wrapper for Rust and Cargo"
license = "Apache-2.0"

[dependencies]
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
thiserror = "1.0"

[dev-dependencies]
async-trait = "0.1"
census = "=0.4.2"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.0", features = ["testing"] }
serial_test = "4.0.1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "bench_overhead"
harness = false

