[package]
name = "otel-shim"
version = "0.1.0"
edition = "2021"
authors = ["OpenTelemetry Rust Compile-Time Instrumentation Contributors"]
description = "Runtime trampoline shim providing extern C OpenTelemetry symbols for compile-time instrumented dependencies"
license = "Apache-2.0"

[dependencies]
opentelemetry = "0.32.0"

[dev-dependencies]
opentelemetry_sdk = { version = "0.32.0", features = ["testing"] }
